<section class="festival-banner">

  <div class="festival-overlay"></div>

  <div class="festival-content">

    <!-- Company Branding -->
    <div class="company-name">
      {{ companyName }}
    </div>

    <!-- Festival Icon -->
    <div class="festival-icon">
      🪔
    </div>

    <!-- Festival Title -->
    <h1>
      {{ festivalTitle }}
    </h1>

    <!-- Marathi Wishes -->
    <p class="festival-message">
      {{ festivalMessage }}
    </p>

    <p class="sub-message">
      {{ subMessage }}
    </p>

    <!-- Decorative Diyas -->
    <div class="diya-decoration">
      🪔 ✨ 🪔 ✨ 🪔
    </div>

    <!-- Contact Button -->
    <a
      class="contact-btn"
      href="https://wa.me/918668267967"
      target="_blank">
      आजच संपर्क करा
    </a>

    <!-- Website -->
    <a
      class="website-link"
      href="https://www.psatechall.com"
      target="_blank">
      {{ website }}
    </a>

    <!-- Footer -->
    <div class="festival-footer">
      <span>आपला Digital Tech Partner</span>
    </div>

  </div>

</section>
